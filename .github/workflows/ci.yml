name: "BillForge CI Pipeline"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-build:
    name: Lint, Test & Build Verification
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit

      - name: Guard against external asset pointers
        # Enforces the "local-only assets" project rule — no Lovable CDN
        # pointers or .asset.json files may land in the repo, so GitHub sync
        # stays self-contained and the project is portable to any host.
        run: |
          set -e
          if git ls-files | grep -E '\.asset\.json$' ; then
            echo "::error::Found .asset.json pointer files. All assets must live locally under public/ or app/."
            exit 1
          fi
          if git grep -nE '/__l5e/assets-v1/' -- ':!.github/**' ':!.lovable/**' ; then
            echo "::error::Found /__l5e/assets-v1/ CDN URL references. Replace with local paths under /public."
            exit 1
          fi

      - name: Run ESLint
        run: npm run lint

      - name: Run Automated Test Suite
        run: npm test

      - name: Verify Production Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
