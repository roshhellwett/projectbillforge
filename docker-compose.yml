services:
  postgres-test:
    image: postgres:16-alpine
    container_name: billforge-test-db
    environment:
      POSTGRES_USER: billforge
      POSTGRES_PASSWORD: billforge_test
      POSTGRES_DB: billforge_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billforge"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
